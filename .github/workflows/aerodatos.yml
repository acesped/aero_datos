name: AERO_DATOS - Groq Gemini OpenRouter - Instagram

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'ID opcional (vacio = siguiente episodio pendiente al publicar)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publicar un Reel en feed y Story'
        required: true
        default: true
        type: boolean
      auto_publish:
        description: 'Publicacion autonoma; tambien se activa si publish=true y episode_id esta vacio'
        required: true
        default: true
        type: boolean
      approved_id:
        description: 'Si auto_publish=false, escribe ID revisado para publicar'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: aerodatos-instagram
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      OPENROUTER_MODEL: 'openrouter/free'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: ${{ vars.IG_EXPECTED_USERNAME || 'aero_datos' }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar librerias y FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Verificar catalogo y sintaxis
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile aerodatos.py
          python - <<'PY'
          import aerodatos
          episodes=aerodatos.catalog()
          assert len(episodes)==500
          assert len({ep['id'] for ep in episodes})==500
          print('Catalogo de 500 temas cargado')
          PY
      - name: Diagnosticar usuario Instagram
        shell: bash
        env:
          REPOSITORY_USERNAME: ${{ vars.IG_EXPECTED_USERNAME }}
          IG_EXPECTED_USERNAME: ${{ vars.IG_EXPECTED_USERNAME || 'aero_datos' }}
        run: |
          set -euo pipefail
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Rama del workflow: $GITHUB_REF"
          if [[ -z "${REPOSITORY_USERNAME:-}" ]]; then
            echo "::warning::IG_EXPECTED_USERNAME no disponible en Repository variables; se usara el respaldo @aero_datos."
          else
            echo "Usuario obtenido desde Repository variables."
          fi
          [[ -n "${IG_EXPECTED_USERNAME:-}" ]] || { echo "::error::Usuario Instagram vacio"; exit 1; }
          echo "Usuario esperado: @${IG_EXPECTED_USERNAME}"
      - name: Validar configuración
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          AUTO: ${{ inputs.auto_publish && 'true' || 'false' }}
          EPISODE: ${{ inputs.episode_id }}
          APPROVED: ${{ inputs.approved_id }}
        run: |
          set -euo pipefail
          [[ -n "${GROQ_API_KEY:-}" || -n "${GEMINI_API_KEY:-}" || -n "${OPENROUTER_API_KEY:-}" ]] || { echo '::error::Configura GROQ_API_KEY, GEMINI_API_KEY u OPENROUTER_API_KEY'; exit 1; }
          if [[ "$PUBLISH" == true ]]; then
            [[ -n "${INSTAGRAM_TOKEN:-}" && -n "${INSTAGRAM_USER_ID:-}" ]] || { echo '::error::Faltan secretos de Instagram'; exit 1; }
            [[ "$INSTAGRAM_USER_ID" =~ ^[0-9]+$ ]] || { echo '::error::INSTAGRAM_USER_ID no es numerico'; exit 1; }
            [[ -n "${IG_EXPECTED_USERNAME:-}" ]] || { echo '::error::IG_EXPECTED_USERNAME vacio incluso tras aplicar respaldo'; exit 1; }
            # Si no se especifica ID, el flujo elige uno pendiente y autoriza
            # esa seleccion automaticamente (no exige approved_id).
            if [[ -z "$EPISODE" ]]; then
              echo "Modo autonomo: se seleccionara un episodio pendiente de forma aleatoria y equilibrada."
            elif [[ "$AUTO" != true ]]; then
              [[ "$EPISODE" == "$APPROVED" ]] || { echo '::error::Con ID especifico, confirma approved_id o activa auto_publish'; exit 1; }
            fi
          fi
      - name: Informar proveedores de IA
        shell: bash
        run: |
          echo 'Orden de proveedores: Groq, Gemini, OpenRouter gratuito'
      - name: Generar video con fotografias libres y publicar
        shell: bash
        env:
          IG_EXPECTED_USERNAME: ${{ vars.IG_EXPECTED_USERNAME || 'aero_datos' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          AUTO: ${{ inputs.auto_publish && 'true' || 'false' }}
          EPISODE: ${{ inputs.episode_id }}
          APPROVED: ${{ inputs.approved_id }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$EPISODE" ]]; then args+=(--episode "$EPISODE"); fi
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          # Con publicacion y sin episodio se habilita la seleccion autonoma,
          # incluso si auto_publish no se marco en la interfaz.
          if [[ "$AUTO" == true || ( "$PUBLISH" == true && -z "$EPISODE" ) ]]; then
            args+=(--auto-publish)
          fi
          if [[ -n "$APPROVED" ]]; then args+=(--approved-id "$APPROVED"); fi
          python aerodatos.py "${args[@]}"
      - name: Guardar guion y MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerodatos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.json
            output/*.mp4
            output/*.jpg
          if-no-files-found: ignore
          retention-days: 7
