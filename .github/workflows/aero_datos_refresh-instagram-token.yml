
name: Renovar token de Instagram - AERO_DATOS

on:
  schedule:
    # Todos los días a las 09:00 UTC (06:00 Brasilia)
    - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-token-refresh
  cancel-in-progress: false

jobs:
  refresh-instagram-token:
    name: Verificar y renovar token Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests PyNaCl

      - name: Comprobar configuración
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          for name in INSTAGRAM_TOKEN INSTAGRAM_USER_ID GH_SECRETS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar el secreto $name"
              exit 1
            fi
          done
          echo "Configuración de secretos completa."

      - name: Verificar y renovar token de Instagram
        env:
          IG_LOGIN_TYPE: instagram
          IG_EXPECTED_USERNAME: aero_datos
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/refresh_instagram_token.py
