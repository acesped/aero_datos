
name: AERO DATOS - Renovacion diaria segura Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read

# Si se añade este mismo grupo al workflow de publicación,
# la renovación y la publicación no se ejecutarán simultáneamente.
concurrency:
  group: aero-datos-instagram-account
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del renovador
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'PyNaCl>=1.5,<2'

      - name: Comprobar identidad y renovar credencial
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_EXPECTED_USERNAME: aero_datos
          IG_SECRET_MANAGER_TOKEN: ${{ secrets.IG_SECRET_MANAGER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_instagram_token.py --refresh
