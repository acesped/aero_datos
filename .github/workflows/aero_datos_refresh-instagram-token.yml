name: AERO DATOS - Vigilar y renovar token Instagram

on:
  workflow_dispatch:
  schedule:
    # Comprobación e intento de renovación todos los días.
    - cron: '23 11 * * *'

permissions:
  contents: read

concurrency:
  group: aero-datos-instagram-token
  cancel-in-progress: false

jobs:
  token-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias mínimas
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'PyNaCl>=1.5,<2'

      - name: Verificar y renovar cuando corresponda
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_EXPECTED_USERNAME: aero_datos
          IG_SECRET_MANAGER_TOKEN: ${{ secrets.IG_SECRET_MANAGER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # En cada ejecución automática o manual, validar e intentar renovar.
          python scripts/refresh_instagram_token.py --refresh
