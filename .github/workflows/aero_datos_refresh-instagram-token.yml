name: Renovar token Instagram - aero_datos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'

permissions:
  contents: read

concurrency:
  group: instagram-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install 'requests>=2.32,<3' 'PyNaCl>=1.5,<2'

      - name: Renovar token y actualizar secreto
        env:
          IG_LOGIN_TYPE: instagram
          IG_EXPECTED_USERNAME: aero_datos
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python scripts/refresh_instagram_token.py
