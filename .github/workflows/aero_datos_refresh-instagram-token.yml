
name: Renovar token Instagram AERO_DATOS

on:
  schedule:
    # Diario a las 06:17, horario de Brasilia
    - cron: "17 9 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aero-datos-instagram-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Verificar y renovar Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install requests PyNaCl

      - name: Verificar y renovar token
        timeout-minutes: 3
        env:
          PYTHONUNBUFFERED: "1"
          IG_LOGIN_TYPE: instagram
          IG_EXPECTED_USERNAME: aero_datos
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Iniciando verificación Instagram..."
          python -u scripts/refresh_instagram_token.py
          echo "Verificación terminada."
